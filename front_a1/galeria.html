<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="img/favicon.jfif">
    <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
    <title>LEGO World - Galeria</title>
    <style>
        #galeria-grade {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
        }

        .galeria-item {
            margin: 0;
            background-color: white;
            border-radius: 10px;
            overflow: hidden;
        }

        .galeria-item img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .galeria-item figcaption {
            padding: 10px;
            text-align: center;
            color: #252525;
        }
    </style>
    
</head>
<body>
    <header class="cabecalho text-center">
        <img src="img/lego-logo.png" alt="Logo LEGO" class="logo">
        <h1>Galeria</h1>
        <p>Imagens do universo LEGO.</p>
    </header>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="index.html">Início</a></li>
                    <li class="nav-item"><a class="nav-link" href="historia.html">História</a></li>
                    <li class="nav-item"><a class="nav-link" href="sobre.html">Sobre</a></li>
                    <li class="nav-item"><a class="nav-link" href="colecoes.html">Coleções</a></li>
                    <li class="nav-item"><a class="nav-link" href="produtos.html">Produtos</a></li>
                    <li class="nav-item"><a class="nav-link" href="lancamentos.html">Lançamentos</a></li>
                    <li class="nav-item"><a class="nav-link" href="personagens.html">Personagens</a></li>
                    <li class="nav-item"><a class="nav-link" href="filmes.html">Filmes e jogos</a></li>
                    <li class="nav-item"><a class="nav-link active" href="galeria.html">Galeria</a></li>
                    <li class="nav-item"><a class="nav-link" href="contato.html">Contato</a></li>
                    <li class="nav-item"><a class="nav-link" href="https://www.lego.com" target="_blank" rel="noopener">LEGO.com</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <p class="text-center" style="font-style: italic;">Algumas imagens do universo LEGO.</p>
        <div id="galeria-grade">
            <figure class="galeria-item">
                <img src="img/lego-city.webp" alt="LEGO City">
                <figcaption>LEGO City</figcaption>
            </figure>
            <figure class="galeria-item">
                <img src="img/lego-starwars.jfif" alt="LEGO Star Wars">
                <figcaption>LEGO Star Wars</figcaption>
            </figure>
            <figure class="galeria-item">
                <img src="img/lego-technic.webp" alt="LEGO Technic">
                <figcaption>LEGO Technic</figcaption>
            </figure>
            <figure class="galeria-item">
                <img src="img/lego-icon.webp" alt="LEGO Icons">
                <figcaption>LEGO Icons</figcaption>
            </figure>
            <figure class="galeria-item">
                <img src="img/produto-1.webp" alt="Conjunto City">
                <figcaption>Conjunto City</figcaption>
            </figure>
            <figure class="galeria-item">
                <img src="img/produto-2.webp" alt="Conjunto Star Wars">
                <figcaption>Conjunto Star Wars</figcaption>
            </figure>
            <figure class="galeria-item">
                <img src="img/sede-lego.jfif" alt="Construções LEGO">
                <figcaption>Construções LEGO</figcaption>
            </figure>
            <figure class="galeria-item">
                <img src="img/lego-historia.jfif" alt="Fundador da LEGO">
                <figcaption>Fundador da LEGO</figcaption>
            </figure>
        </div>
    </main>

    <footer class="rodape text-center">
        <p>LEGO World - Projeto acadêmico sem vínculo oficial com a LEGO.</p>
        <button id="botao-tema">Alternar tema</button>
    </footer>

    <script src="bootstrap/js/bootstrap.bundle.min.js"></script>

    <script src="js/script.js"></script>

</body>
</html>
